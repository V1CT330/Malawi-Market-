name: Malawi Market Production Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        options:
          - production-apk
        required: true
        default: production-apk
        description: Build the production APK from the selected main branch revision.

jobs:
  build_android:
    name: Build production Android APK
    type: build
    params:
      platform: android
      profile: production
