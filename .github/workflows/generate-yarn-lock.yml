name: Generate Yarn Lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/generate-yarn-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Generate yarn.lock
        run: yarn install --ignore-scripts

      - name: Commit lockfile
        run: |
          if [ ! -f yarn.lock ]; then
            echo "yarn.lock was not generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "chore: add Yarn lockfile for reproducible builds"
          git push origin main
